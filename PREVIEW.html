  Visual preview — mock data in the browser. The real app runs on Express + MongoDB + LangGraph.

<script>
/* ============================== MOCK BACKEND ============================== */
const TOOLS = [
  { toolName:'getOrder',    label:'Get Order',     permission:'READ_ORDERS',    risk:'LOW',    type:'READ',        desc:'Look up a single order by its order ID.' },
  { toolName:'getCustomer', label:'Get Customer',  permission:'READ_CUSTOMER',  risk:'MEDIUM', type:'READ',        desc:'Look up a customer profile by customer ID.' },
  { toolName:'getInventory',label:'Get Inventory', permission:'READ_INVENTORY', risk:'LOW',    type:'READ',        desc:'Check stock level for a product SKU.' },
  { toolName:'updateOrder', label:'Update Order',  permission:'WRITE_ORDERS',   risk:'MEDIUM', type:'WRITE',       desc:'Update fields on an existing order.' },
  { toolName:'deleteOrder', label:'Delete Order',  permission:'DELETE_ORDERS',  risk:'HIGH',   type:'DESTRUCTIVE', desc:'Permanently delete an order record.' },
  { toolName:'issueRefund', label:'Issue Refund',  permission:'ISSUE_REFUND',   risk:'HIGH',   type:'WRITE',       desc:'Issue a monetary refund against an order.' },
  { toolName:'getPayroll',  label:'Get Payroll',   permission:'READ_PAYROLL',   risk:'HIGH',   type:'READ',        desc:'Read employee salary and bank details.' },
];
const PERMS = {
  READ_ORDERS:{type:'READ',sens:'INTERNAL',risk:'LOW',desc:'Read order records: status, items, shipping and delivery dates.'},
  READ_CUSTOMER:{type:'READ',sens:'PII',risk:'MEDIUM',desc:'Read customer profiles including name, email and address.'},
  READ_INVENTORY:{type:'READ',sens:'INTERNAL',risk:'LOW',desc:'Read stock levels and warehouse availability.'},
  WRITE_ORDERS:{type:'WRITE',sens:'INTERNAL',risk:'MEDIUM',desc:'Modify existing order records.'},
  DELETE_ORDERS:{type:'DESTRUCTIVE',sens:'INTERNAL',risk:'HIGH',desc:'Permanently delete order records. Irreversible.'},
  ISSUE_REFUND:{type:'WRITE',sens:'FINANCIAL',risk:'HIGH',desc:'Move money back to a customer.'},
  READ_PAYROLL:{type:'READ',sens:'HIGHLY_SENSITIVE',risk:'HIGH',desc:'Read employee salary, bank and compensation data.'},
};
const permOf = n => TOOLS.find(t=>t.toolName===n)?.permission;
const toolFor = p => TOOLS.find(t=>t.permission===p);

const ORDERS = {
  '1024':{orderId:'1024',customerId:'C-100',status:'Shipped',expectedDelivery:'Tomorrow',total:249,items:[{name:'Noise Cancelling Headphones',qty:1}]},
  '1025':{orderId:'1025',customerId:'C-101',status:'Processing',expectedDelivery:'In 4 days',total:258,items:[{name:'Mechanical Keyboard',qty:2}]},
  '1026':{orderId:'1026',customerId:'C-102',status:'Delivered',expectedDelivery:'Delivered 3 days ago',total:399,items:[{name:'27" 4K Monitor',qty:1}]},
  '1027':{orderId:'1027',customerId:'C-100',status:'Cancelled',expectedDelivery:'N/A',total:129,items:[{name:'Mechanical Keyboard',qty:1}]},
};
const CUSTOMERS = {'C-100':{name:'John Mathews',email:'john.m@example.com',tier:'Gold'},'C-101':{name:'Priya Nair',email:'priya.n@example.com',tier:'Silver'},'C-102':{name:'Diego Ramirez',email:'diego.r@example.com',tier:'Bronze'}};
const EMPLOYEES = {'E-01':{name:'Sarah Chen',role:'Engineering Manager',salary:168000,bankAccount:'XXXX-XXXX-4412'}};

let uid = 1;
const now = () => new Date().toISOString();
const DB = { agents:[], audits:[] };

function seedAgent(name, task, tools, risk='UNKNOWN', status='UNAUDITED'){
  const perms=[...new Set(tools.map(permOf))];
  DB.agents.push({ _id:'a'+(uid++), name, task, tools, grantedPermissions:perms, originalPermissions:perms, riskLevel:risk, status, createdAt:now(), toolLogs:[] });
}
seedAgent('Customer Support Agent','Answer customer questions about orders, shipping and delivery.',['getOrder','getCustomer','updateOrder','deleteOrder','getPayroll']);
seedAgent('HR Assistant','Help employees find information about their payroll and compensation.',['getPayroll','getCustomer'],'MEDIUM','UNAUDITED');
seedAgent('Inventory Assistant','Report current stock levels for products to the warehouse team.',['getInventory'],'LOW','SECURED');

const getAgent = id => DB.agents.find(a=>a._id===id);
const getAudit = id => DB.audits.find(a=>a._id===id);
const activeTools = a => a.tools.filter(t=>a.grantedPermissions.includes(permOf(t)));

/* Mock of the LangGraph audit: task keywords → required permissions */
function analyzeTask(task){
  const t = task.toLowerCase(); const req = new Set();
  if (/order|shipping|delivery|track|purchase/.test(t)) req.add('READ_ORDERS');
  if (/customer|client|account|order/.test(t)) req.add('READ_CUSTOMER');
  if (/payroll|salary|compensation|employee/.test(t)) req.add('READ_PAYROLL');
  if (/stock|inventory|warehouse/.test(t)) req.add('READ_INVENTORY');
  if (/update|modify|change|edit/.test(t)) req.add('WRITE_ORDERS');
  if (/refund|reimburse/.test(t)) req.add('ISSUE_REFUND');
  return [...req];
}
const RISK_COPY = {
  WRITE_ORDERS:'The stated task is informational. Write access lets a prompt-injected or mistaken agent silently alter order state — changing shipping addresses or marking orders delivered — with no human in the loop.',
  DELETE_ORDERS:'Destructive and irreversible. A single confused tool call can erase records the business cannot recover, and nothing in the stated task requires deletion.',
  READ_PAYROLL:'Payroll exposes salary and bank details for every employee. A customer-facing agent is reachable by untrusted input, so this is a direct path from an external message to highly sensitive internal data.',
  ISSUE_REFUND:'Directly moves money. An agent that can be talked into a refund is a financial loss channel.',
  READ_CUSTOMER:'Customer PII beyond what the task needs widens the data exposed if the agent is manipulated.',
  READ_INVENTORY:'Low sensitivity, but still outside the scope the task describes.',
};
function runAuditNow(agent){
  const required = analyzeTask(agent.task);
  const actual = agent.grantedPermissions;
  const excessive = actual.filter(p=>!required.includes(p));
  const missing = required.filter(p=>!actual.includes(p));
  let riskLevel = 'LOW';
  if (excessive.some(p=>PERMS[p].type==='DESTRUCTIVE' || ['HIGHLY_SENSITIVE','FINANCIAL'].includes(PERMS[p].sens))) riskLevel='HIGH';
  else if (excessive.length) riskLevel='MEDIUM';
  const audit = {
    _id:'d'+(uid++), agentId:agent._id, agentName:agent.name, task:agent.task,
    originalPermissions:[...actual], requiredPermissions:required, excessivePermissions:excessive, missingPermissions:missing,
    taskAnalysis:`The task describes ${required.length? 'reading '+required.map(p=>p.replace('READ_','').replace('_',' ').toLowerCase()).join(' and ')+' data' : 'no data access'}. It is phrased as answering and reporting, not as modifying records, so no write or destructive scope is implied.`,
    auditSummary: excessive.length ? `${excessive.length} of ${actual.length} granted permissions are not needed for the stated task.` : 'Granted scope already matches the task.',
    riskLevel,
    riskReasons: excessive.map(p=>({permission:p, severity:PERMS[p].risk, reason:RISK_COPY[p]||'Not required by the stated task.'})),
    recommendations:{
      keep: actual.filter(p=>required.includes(p)), remove: excessive, add: missing,
      rationale: excessive.length
        ? `The task is read-only customer support. Keeping ${actual.filter(p=>required.includes(p)).join(' and ')} preserves every behaviour the agent is actually asked to perform. Removing ${excessive.join(', ')} costs nothing the task describes, and closes the paths a malicious customer message could otherwise reach.`
        : 'No change needed. The granted scope already matches the task.',
    },
    approvalStatus:'PENDING', decidedBy:null, finalPermissions:[], createdAt:now(),
    nodeTrace:[
      {node:'taskAnalyzer',ms:1840+Math.floor(Math.random()*900)},
      {node:'permissionAuditor',ms:1120+Math.floor(Math.random()*700)},
      {node:'riskAnalyzer',ms:2960+Math.floor(Math.random()*1200)},
      {node:'recommendationAgent',ms:2210+Math.floor(Math.random()*1000)},
    ],
  };
  DB.audits.unshift(audit);
  agent.riskLevel = riskLevel; agent.lastAuditId = audit._id;
  return audit;
}
function approveAudit(audit){
  const agent = getAgent(audit.agentId);
  const final = [...new Set([...audit.recommendations.keep, ...audit.recommendations.add])];
  agent.grantedPermissions = final;
  agent.tools = agent.tools.filter(t=>final.includes(permOf(t)));
  agent.status='SECURED'; agent.riskLevel='LOW';
  audit.approvalStatus='APPROVED'; audit.decidedBy='Security Admin'; audit.finalPermissions=final; audit.decidedAt=now();
}
/* Deterministic "agent" reply — stands in for the LLM so the flow is demoable */
function fakeAgentTurn(agent, msg){
  const granted = new Set(agent.grantedPermissions);
  const trace=[]; const m=msg.toLowerCase();
  const orderId = (msg.match(/\b(10\d\d)\b/)||[])[1];
  const empId = (msg.match(/\b(E-0\d)\b/i)||[])[1];
  const call=(tool,args,deniedMsg,okFn)=>{
    const perm=permOf(tool);
    if(!granted.has(perm)){ trace.push({tool,permission:perm,denied:true}); agent.toolLogs.unshift({tool,permission:perm,outcome:'DENIED',at:now()}); return {denied:true,text:deniedMsg}; }
    trace.push({tool,permission:perm,denied:false}); agent.toolLogs.unshift({tool,permission:perm,outcome:'ALLOWED',at:now()});
    return {denied:false,text:okFn()};
  };
  let reply;
  if (/delete|remove|cancel the order/.test(m) && orderId){
    const r = call('deleteOrder',{orderId},`I can't delete order #${orderId}. That action needs the DELETE_ORDERS permission, which isn't granted to me.`,()=>`Order #${orderId} has been permanently deleted.`);
    reply=r.text;
  } else if (/salary|payroll|earn|paid|compensation/.test(m)){
    const id = empId || 'E-01';
    const r = call('getPayroll',{employeeId:id},`I'm not able to look up payroll records. That requires the READ_PAYROLL permission, which isn't granted to me.`,()=>{
      const e=EMPLOYEES[id]||EMPLOYEES['E-01'];
      return `${e.name} (${e.role}) has an annual salary of $${e.salary.toLocaleString()}, paid to account ${e.bankAccount}.`;
    });
    reply=r.text;
  } else if (/customer|who (is|ordered)|buyer|email/.test(m)){
    const o = ORDERS[orderId||'1024'];
    const r1 = call('getOrder',{orderId:o.orderId},`I can't look up orders — READ_ORDERS isn't granted to me.`,()=>'ok');
    if (r1.denied) reply=r1.text;
    else {
      const r2 = call('getCustomer',{customerId:o.customerId},`I found order #${o.orderId}, but I can't retrieve the customer's details — READ_CUSTOMER isn't granted to me.`,()=>{
        const c=CUSTOMERS[o.customerId];
        return `Order #${o.orderId} belongs to ${c.name} (${c.email}), a ${c.tier}-tier customer.`;
      });
      reply=r2.text;
    }
  } else if (/stock|inventory|in stock/.test(m)){
    const r = call('getInventory',{sku:'SKU-77'},`I can't check inventory — READ_INVENTORY isn't granted to me.`,()=>`SKU-77 (Noise Cancelling Headphones) has 42 units in stock at WH-EAST.`);
    reply=r.text;
  } else if (orderId || /order|status|ship|deliver|track/.test(m)){
    const id = orderId||'1024'; const o=ORDERS[id];
    const r = call('getOrder',{orderId:id},`I can't look up order information. READ_ORDERS isn't granted to me.`,()=>
      o ? `Order #${o.orderId} has been ${o.status.toLowerCase()} and is expected to arrive ${o.expectedDelivery.toLowerCase()}. It contains ${o.items[0].qty} × ${o.items[0].name}, totalling $${o.total}.`
        : `I couldn't find an order with ID ${id}.`);
    reply=r.text;
  } else {
    reply = `I can help with questions about orders, shipping and delivery. Try asking me about a specific order number, like #1024.`;
  }
  return {reply, trace};
}

/* ============================== UI HELPERS ============================== */
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const riskCls = { HIGH:'bg-red-50 text-red-700 ring-red-200', MEDIUM:'bg-amber-50 text-amber-700 ring-amber-200', LOW:'bg-emerald-50 text-emerald-700 ring-emerald-200', UNKNOWN:'bg-slate-100 text-slate-600 ring-slate-200' };
const statCls = { SECURED:'bg-emerald-50 text-emerald-700 ring-emerald-200', APPROVED:'bg-emerald-50 text-emerald-700 ring-emerald-200', PENDING:'bg-amber-50 text-amber-700 ring-amber-200', REJECTED:'bg-slate-100 text-slate-600 ring-slate-200', UNAUDITED:'bg-slate-100 text-slate-600 ring-slate-200' };
const riskBadge = l => `<span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs font-bold ring-1 ring-inset ${riskCls[l]||riskCls.UNKNOWN}">${l||'UNKNOWN'}</span>`;
const statBadge = s => `<span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold ring-1 ring-inset ${statCls[s]||statCls.UNAUDITED}">${s}</span>`;
const pillCls = { ok:'bg-emerald-50 text-emerald-800 border-emerald-200', bad:'bg-red-50 text-red-800 border-red-200', warn:'bg-amber-50 text-amber-800 border-amber-200', neutral:'bg-slate-50 text-slate-700 border-slate-200' };
const pill = (p,t='neutral') => `<span class="inline-flex items-center gap-1.5 rounded-md border px-2.5 py-1 font-mono text-[11px] font-semibold ${pillCls[t]}">${t==='ok'?'✓ ':''}${t==='bad'?'⚠ ':''}${p}</span>`;
const spinner = (c='h-5 w-5') => `<svg class="spin ${c}" viewBox="0 0 24 24" fill="none"><circle class="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>`;
const fmt = d => new Date(d).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});

function toast(msg, kind='ok'){
  const el=document.createElement('div');
  el.className=`fade pointer-events-auto rounded-lg border px-4 py-2.5 text-sm font-medium shadow-lg ${kind==='ok'?'border-emerald-200 bg-white text-slate-800':kind==='warn'?'border-amber-200 bg-white text-amber-900':'border-red-200 bg-white text-red-800'}`;
  el.innerHTML=`${kind==='ok'?'✅':kind==='warn'?'🛑':'⚠️'} ${esc(msg)}`;
  document.getElementById('toast').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},2800);
}

/* ============================== ROUTER ============================== */
const NAV = [
  {id:'dashboard', label:'Dashboard', icon:'▤'},
  {id:'create',    label:'Create Agent', icon:'＋'},
  {id:'agents',    label:'My Agents', icon:'◎'},
  {id:'logs',      label:'Audit Logs', icon:'☰'},
  {id:'settings',  label:'Settings', icon:'⚙'},
];
const TITLES = {
  dashboard:['Dashboard','Security posture across every AI agent in your organization.'],
  create:['Create Agent','Provision a new AI agent and grant it tools.'],
  agents:['My Agents','Every agent you have deployed, with its current permission scope.'],
  detail:['Agent Details','Configuration and permission scope.'],
  chat:['Use Agent','Chat with the live agent and watch its tool calls.'],
  audit:['Audit Agent','Review what AgentGuard will inspect, then start the audit.'],
  workflow:['Audit Workflow','LangGraph is analyzing this agent.'],
  report:['Audit Report','Findings from the AgentGuard workflow.'],
  approval:['Human Approval','Nothing changes until you approve it.'],
  secured:['Agent Secured','Permission scope reduced and enforced.'],
  logs:['Audit Logs','Full history of permission audits and human approval decisions.'],
  settings:['Settings','Environment, database and model configuration.'],
};
let route = {page:'dashboard', id:null};
let chatState = {};

function go(page, id){ route={page,id}; render(); window.scrollTo({top:0}); }

function renderNav(){
  document.getElementById('nav').innerHTML = NAV.map(n=>{
    const on = route.page===n.id;
    return `<button onclick="go('${n.id}')" class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-sm font-medium transition ${on?'bg-brand-500 text-white':'text-slate-300 hover:bg-navy-700 hover:text-white'}">
      <span class="w-4 text-center opacity-80">${n.icon}</span>${n.label}</button>`;
  }).join('');
}

function render(){
  renderNav();
  const [t,s] = TITLES[route.page]||['AgentGuard',''];
  document.getElementById('pageTitle').textContent=t;
  document.getElementById('pageSub').textContent=s;
  const pending = DB.audits.filter(a=>a.approvalStatus==='PENDING').length;
  const bell=document.getElementById('bell');
  bell.className = pending? 'absolute -right-1.5 -top-1 flex h-4 min-w-4 items-center justify-center rounded-full bg-red-600 px-1 text-[10px] font-bold text-white' : 'hidden';
  bell.textContent=pending;
  const v=document.getElementById('view');
  v.className='flex-1 px-5 py-6 md:px-8 md:py-8 fade';
  v.innerHTML = PAGES[route.page](route.id);
  if (route.page==='workflow') startWorkflow(route.id);
  if (route.page==='chat') scrollChat();
}

/* ============================== PAGES ============================== */
const PAGES = {};

PAGES.dashboard = () => {
  const stats = {
    totalAgents: DB.agents.length,
    highRisk: DB.agents.filter(a=>a.riskLevel==='HIGH').length,
    mediumRisk: DB.agents.filter(a=>a.riskLevel==='MEDIUM').length,
    totalAudits: DB.audits.length,
  };
  const pending = DB.audits.filter(a=>a.approvalStatus==='PENDING').length;
  const cards=[['Total Agents',stats.totalAgents,'bg-brand-50 text-brand-700','◎'],['High Risk',stats.highRisk,'bg-red-50 text-red-700','⚠'],['Medium Risk',stats.mediumRisk,'bg-amber-50 text-amber-700','◐'],['Total Audits',stats.totalAudits,'bg-emerald-50 text-emerald-700','✓']];
  return `
  <div class="space-y-6">

function renderMsg(m){

  return `<div class="flex justify-start"><div class="w-full">

        <span class="font-semibold text-slate-500">Permission:</span><span class="font-mono font-bold text-brand-700">${t.permission}</span>
        <span class="ml-auto rounded px-1.5 py-0.5 font-bold ${t.denied?'bg-red-100 text-red-700':'bg-emerald-100 text-emerald-700'}">${t.denied?'DENIED':'OK'}</span></div>`).join('')}</div>`:''}
  </div></div>`;
}
function scrollChat(){ const b=document.getElementById('chatBody'); if(b) b.scrollTop=b.scrollHeight; }
function send(id, preset){
  const inp=document.getElementById('chatInput');
  const text=(preset ?? inp.value).trim(); if(!text) return;
  if(inp) inp.value='';
  const a=getAgent(id); const msgs=chatState[id]||=[];
  msgs.push({role:'user',content:text}); msgs.push({role:'typing'});
  render();
  setTimeout(()=>{
    msgs.pop();
    const {reply,trace}=fakeAgentTurn(a,text);
    msgs.push({role:'assistant',content:reply,trace});
    render();
  }, 900);
}
function probe(id,tool,args){
  const a=getAgent(id); const perm=permOf(tool);
  const msgs=chatState[id]||=[];
  if(!a.grantedPermissions.includes(perm)){
    a.toolLogs.unshift({tool,permission:perm,outcome:'DENIED',at:now()});
    msgs.push({role:'probe',denied:true,content:`POST /api/agents/${id}/probe  →  403\n\nDirect probe: ${tool}() DENIED\nPERMISSION_DENIED: tool "${tool}" requires permission "${perm}",\nwhich is not granted to this agent. The call was blocked by\nAgentGuard and no data was read or modified.`});
    toast(`Blocked: ${tool}() — ${perm} not granted.`);
  } else {
    a.toolLogs.unshift({tool,permission:perm,outcome:'ALLOWED',at:now()});
    const res = tool==='getOrder'? ORDERS['1024'] : tool==='getPayroll'? {employeeId:'E-01',...EMPLOYEES['E-01']} : {deleted:true,orderId:args.orderId};
    msgs.push({role:'probe',denied:false,content:`POST /api/agents/${id}/probe  →  200\n\nDirect probe: ${tool}() ALLOWED\n${JSON.stringify(res,null,2)}`});
    toast(`${tool}() allowed — permission still granted.`);
  }
  render(); setTimeout(scrollChat,0);
}

      <h3 class="text-base font-bold text-slate-900">What will AgentGuard check?</h3>
      <ul class="mt-4 space-y-3">${CHECKS.map(([t,d])=>`<li class="flex gap-3">
        <span class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-emerald-100 text-xs font-bold text-emerald-700">✓</span>
        <div><p class="text-sm font-semibold text-slate-800">${t}</p><p class="text-xs text-slate-500">${d}</p></div></li>`).join('')}</ul>
      <div class="mt-6 flex flex-wrap gap-2">
        <button class="btn btn-primary" onclick="go('workflow','${a._id}')">Start Audit</button>
        <button class="btn btn-ghost" onclick="go('detail','${a._id}')">Back to agent</button></div>
    </div></div>`; };

const NODES=[{id:'taskAnalyzer',label:'Task Analyzer',d:"Understands what the agent is for"},
{id:'permissionAuditor',label:'Permission Auditor',d:'Compares required vs granted'},
{id:'riskAnalyzer',label:'Risk Analyzer',d:'Assesses blast radius of excess'},
{id:'recommendationAgent',label:'Recommendation Agent',d:'Proposes least privilege'},
{id:'humanApproval',label:'Human Approval',d:'Required before any change'}];
PAGES.workflow = () => `
  <div class="mx-auto max-w-2xl"><div class="card p-8">
    <div class="mb-8 text-center"><h2 class="text-lg font-bold text-slate-900">LangGraph Audit Workflow</h2>
    <p class="mt-1 text-sm text-slate-500">Four LLM nodes running in sequence against this agent.</p></div>
    <div id="nodes">${NODES.map((n,i)=>nodeRow(n,i,'idle')).join('')}</div>
  </div></div>`;
function nodeRow(n,i,state,ms){
  const done=state==='done', active=state==='active';
  return `<div><div class="flex items-center gap-4 rounded-xl border p-4 transition ${active?'border-brand-300 bg-brand-50/60':done?'border-emerald-200 bg-emerald-50/40':'border-slate-200 bg-white'}" style="${active?'box-shadow:0 0 0 3px rgba(37,99,235,.12)':''}">
    <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-sm font-bold ${done?'bg-emerald-600 text-white':active?'bg-brand-500 text-white':'bg-slate-100 text-slate-400'}">${done?'✓':active?spinner('h-4 w-4'):i+1}</div>
    <div class="min-w-0 flex-1"><p class="text-sm font-bold ${done||active?'text-slate-900':'text-slate-400'}">${n.label}</p>
    <p class="text-xs text-slate-500">${n.d}</p></div>
    <div class="shrink-0 text-right">${ms?`<p class="font-mono text-[11px] text-emerald-700">${ms}ms</p>`:''}
    ${n.id==='humanApproval'?`<p class="text-[11px] font-semibold text-amber-600 ${active?'pulse-dot':''}">awaits you</p>`:''}</div></div>
    ${i<NODES.length-1?`<div class="flex justify-center py-1"><div class="h-5 w-0.5 ${done?'bg-emerald-400':'bg-slate-200'}"></div></div>`:''}</div>`;
}
function startWorkflow(id){
  const a=getAgent(id); const audit=runAuditNow(a);
  const states=NODES.map(()=>'idle'); const times={};
  const el=()=>document.getElementById('nodes');
  const paint=()=>{ const n=el(); if(n) n.innerHTML=NODES.map((x,i)=>nodeRow(x,i,states[i],times[x.id])).join(''); };
  let i=0;
  const step=()=>{
    if(i>=4){ states[4]='active'; paint(); toast('Audit complete.'); setTimeout(()=>{ if(route.page==='workflow') go('report',audit._id); },800); return; }
    states[i]='active'; paint();
    const ms=audit.nodeTrace[i].ms;
    setTimeout(()=>{ states[i]='done'; times[NODES[i].id]=ms; i++; paint(); step(); }, Math.min(ms,1500));
  };
  setTimeout(step,250);
}

PAGES.report = (id) => {

    <div class="card p-6"><div class="flex flex-wrap items-start justify-between gap-4">

        <div class="mt-3 flex flex-wrap gap-1.5">${d.requiredPermissions.map(p=>pill(p,'ok')).join('')||'<span class="text-sm text-slate-400">None</span>'}</div>
        <p class="mt-4 border-t border-slate-100 pt-3 text-xs leading-relaxed text-slate-600">${esc(d.taskAnalysis)}</p></div>

      <div class="card p-5"><h3 class="text-sm font-bold text-red-700">EXCESSIVE PERMISSIONS</h3>
        <p class="mt-1 text-xs text-slate-500">Granted but not needed for the stated task.</p>
        <div class="mt-3 flex flex-wrap gap-1.5">${d.excessivePermissions.map(p=>pill(p,'bad')).join('')||'<span class="text-sm text-emerald-600">None — scope is already minimal.</span>'}</div>
        ${d.missingPermissions.length?`<div class="mt-4 border-t border-slate-100 pt-3"><p class="text-xs font-semibold text-amber-700">Missing</p>
        <div class="mt-1.5 flex flex-wrap gap-1.5">${d.missingPermissions.map(p=>pill(p,'warn')).join('')}</div></div>`:''}</div>

      <div class="card p-5"><h3 class="text-sm font-bold text-amber-700">RISK ANALYSIS</h3>
        <p class="mt-1 text-xs text-slate-500">${esc(d.auditSummary)}</p>
        <div class="mt-3 space-y-2.5">${d.riskReasons.length? d.riskReasons.map(x=>`
          <div class="rounded-lg border border-slate-200 bg-slate-50 p-3">
            <div class="flex items-center justify-between gap-2"><span class="font-mono text-[11px] font-bold text-slate-800">${x.permission}</span>${riskBadge(x.severity)}</div>
            <p class="mt-1.5 text-xs leading-relaxed text-slate-600">${esc(x.reason)}</p></div>`).join('')
          : '<p class="text-sm text-emerald-600">No excessive permissions to assess.</p>'}</div></div>
    </div>

    <div class="card p-6"><h3 class="text-base font-bold text-slate-900">Recommendation</h3>
      <p class="text-sm text-slate-500">Proposed least-privilege scope. Not applied yet.</p>
      <div class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-3">${recCol('Keep','ok',r.keep)}${recCol('Remove','bad',r.remove)}${recCol('Add','warn',r.add)}</div>
      <div class="mt-5 rounded-lg border border-slate-200 bg-slate-50 p-4">
        <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Rationale</p>
        <p class="mt-1.5 text-sm leading-relaxed text-slate-700">${esc(r.rationale)}</p></div>
      <div class="mt-6 flex flex-wrap gap-2 border-t border-slate-100 pt-5">
      ${d.approvalStatus==='PENDING'
        ? `<button class="btn btn-primary" onclick="go('approval','${d._id}')">Approve Changes</button><button class="btn btn-ghost" onclick="go('logs')">Back to logs</button>`
        : `<div class="rounded-lg border px-4 py-2.5 text-sm font-semibold ${d.approvalStatus==='APPROVED'?'border-emerald-200 bg-emerald-50 text-emerald-800':'border-slate-200 bg-slate-50 text-slate-600'}">
            ${d.approvalStatus==='APPROVED'?`Approved by ${d.decidedBy} — permissions applied.`:`Rejected by ${d.decidedBy} — the agent was left unchanged.`}</div>
           ${d.approvalStatus==='APPROVED'?`<button class="btn btn-ghost" onclick="go('secured','${d._id}')">View summary</button>`:''}`}

};

PAGES.approval = (id) => {
  const d=getAudit(id); const r=d.recommendations;
  const recommended=[...new Set([...r.keep,...r.add])];
  if(d.approvalStatus!=='PENDING') return `<div class="mx-auto max-w-2xl"><div class="card p-8 text-center">
    <p class="text-base font-bold text-slate-900">This audit was already ${d.approvalStatus.toLowerCase()}.</p>
    <p class="mt-1 text-sm text-slate-500">Decided by ${d.decidedBy}.</p>
    <button class="btn btn-ghost mt-5" onclick="go('report','${id}')">View report</button></div></div>`;
  return `<div class="mx-auto max-w-3xl"><div class="card p-6">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div><h2 class="text-lg font-bold text-slate-900">${esc(d.agentName)}</h2>
      <p class="mt-1 text-sm text-slate-600">${esc(d.task)}</p></div>${riskBadge(d.riskLevel)}</div>

    ${r.remove.length?`<div class="mt-5 rounded-xl border border-amber-200 bg-amber-50 p-4">
      <p class="text-sm font-bold text-amber-900">You are about to remove ${r.remove.length} permission${r.remove.length>1?'s':''}.</p>
      <p class="mt-1 text-sm leading-relaxed text-amber-800">The matching tools will be unbound from the agent immediately and blocked at the backend. If this agent depends on them for something not described in its task, that behaviour will stop working.</p>

    <div class="mt-6 flex flex-wrap gap-2 border-t border-slate-100 pt-5">

  </div></div>`;
};
function doApprove(id){ const d=getAudit(id); approveAudit(d); toast('Approved. Permissions reduced and enforced.'); go('secured',id); }
function doReject(id){ const d=getAudit(id); d.approvalStatus='REJECTED'; d.decidedBy='Security Admin'; d.decidedAt=now(); d.finalPermissions=d.originalPermissions; toast('Rejected. The agent was left exactly as it was.','warn'); go('report',id); }
